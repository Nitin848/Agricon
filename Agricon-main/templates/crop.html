
<!DOCTYPE html>
<html lang="eng" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Agricon-Crop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css">
  <script src="/static/scripts/cities.js"></script>
  <style>
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      background:
        linear-gradient(rgba(10, 26, 10, 0.55), rgba(10, 26, 10, 0.65)),
        url(static/images/farm_background.jpg) center/cover no-repeat fixed;
      color: #102313;
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 28px 16px;
    }
    .page-wrap {
      max-width: 760px;
      margin: 0 auto;
    }
    .hero-title {
      color: #ffffff;
      text-align: center;
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      font-weight: 700;
      margin-bottom: 18px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 18px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(4px);
      padding: 26px;
    }
    .section-title {
      margin-bottom: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #1f4a27;
      text-align: center;
    }
    .form-label {
      font-weight: 600;
      color: #1b2e1f;
      margin-bottom: 6px;
    }
    .form-control,
    .form-select {
      border-radius: 10px;
      border: 1px solid #cdd7ce;
      min-height: 44px;
    }
    .form-control:focus,
    .form-select:focus {
      border-color: #2c9a46;
      box-shadow: 0 0 0 0.2rem rgba(44, 154, 70, 0.18);
    }
    .predict-btn {
      width: 100%;
      min-height: 46px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      letter-spacing: 0.2px;
      background: linear-gradient(135deg, #2e9f47, #247b37);
      color: #fff;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin-top: 8px;
    }
    .predict-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(36, 123, 55, 0.3);
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <h1 class="hero-title">Find out the most suitable crop to grow in your farm</h1>
    <div class="glass-card">
      <div class="section-title">Enter Soil and Weather Inputs</div>
      <form method="POST" name="myform" action="{{ url_for('crop_prediction') }}">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="nit">Nitrogen</label>
            <input class="form-control" type="number" id="nit" name="nitrogen" min="1" max="100" placeholder="e.g. 50" required>
            <div id="res"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="pho">Phosphorous</label>
            <input class="form-control" type="number" id="pho" name="phosphorous" min="1" max="100" placeholder="e.g. 50" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="pot">Pottasium</label>
            <input class="form-control" type="number" id="pot" name="pottasium" min="1" max="100" placeholder="e.g. 50" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="ph">pH level</label>
            <input class="form-control" type="number" id="ph" name="ph" min="1" max="14" step="0.1" placeholder="e.g. 7" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="rain">Rainfall</label>
            <input class="form-control" type="number" id="rain" name="rainfall" min="1" max="200" placeholder="e.g. 50" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="sts">State</label>
            <select class="form-select" onchange="print_city('state', this.selectedIndex);" id="sts" name="stt" required>
              <option value="" disabled selected hidden>Choose a State</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label" for="state">City</label>
            <select class="form-select" id="state" name="city" required>
              <option value="" disabled selected hidden>Choose a District</option>
            </select>
          </div>
          <div class="col-12">
            <button class="predict-btn" type="submit">Predict Crop</button>
          </div>
        </div>
      </form>
    </div>
  </div>
  <script language="javascript">
    print_state("sts");
  </script>
        <script>
          function validate(){
            var num = document.getElementById('nit').value;
            
            if(num>0 && num<100){
              return true;
            }else{
              window.alert("Enter the value of nitrogen between 1 - 100");
              return false
            }
          }

          function validate2(){
            var num = document.getElementById('pho').value;
            
            if(num>0 && num<100){
              return true;
            }else{
              window.alert("Enter the value of phospharaus between 1 - 100");
              return false
            }
          }
          function validate3(){
            var num = document.getElementById('pot').value;
            
            if(num>0 && num<100){
              return true;
            }else{
              window.alert("Enter the value of pottasium between 1 - 100");
              return false
            }
          }
          function validate4(){
            var num = document.getElementById('ph').value;
            
            if(num>0 && num<15){
              return true;
            }else{
              window.alert("Enter the value of ph between 1 - 14");
              return false
            }
          }
          function validate5(){
            var num = document.getElementById('rain').value;
            
            if(num>0 && num<200){
              return true;
            }else{
              window.alert("Enter the value of Rainfall between 1 - 200");
              return false
            }
          }
        </script>
</body>
</html>
