<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agricon - Fertilizer Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        background:
          linear-gradient(rgba(18, 32, 18, 0.58), rgba(18, 32, 18, 0.72)),
          url(static/images/fert.jpeg) center/cover no-repeat fixed;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .result-card {
        width: 100%;
        max-width: 820px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
        padding: 26px 24px;
      }

      .result-title {
        color: #145a2a;
        font-weight: 800;
        font-size: 1.25rem;
        margin-bottom: 10px;
        text-align: center;
      }

      .result-body {
        color: #0f3d20;
        font-size: 1.02rem;
        line-height: 1.65;
        text-align: left;
      }

      .back-link {
        display: inline-block;
        margin-top: 16px;
        text-decoration: none;
        color: #145a2a;
        font-weight: 600;
      }

      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="result-card">
      <div class="result-title">Fertilizer Recommendation</div>
      <div class="result-body">
        {{ prediction_result }}
      </div>

      <a class="back-link" href="{{ url_for('fertilizer_recommend') }}">Go back to Fertilizer</a>
    </div>
  </body>
</html>
