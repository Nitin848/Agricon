<!DOCTYPE html>
<html lang="eng" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Agricon-Fertilizer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css">
  <style>
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      background:
        linear-gradient(rgba(18, 32, 18, 0.55), rgba(18, 32, 18, 0.7)),
        url(static/images/fert.jpeg) center/cover no-repeat fixed;
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 28px 16px;
      color: #102313;
    }
    .page-wrap {
      max-width: 760px;
      margin: 0 auto;
    }
    .hero-title {
      color: #fff;
      text-align: center;
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      font-weight: 700;
      margin-bottom: 18px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.93);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 18px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(4px);
      padding: 26px;
    }
    .section-title {
      margin-bottom: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #1f4a27;
      text-align: center;
    }
    .form-label {
      font-weight: 600;
      color: #1b2e1f;
      margin-bottom: 6px;
    }
    .form-control,
    .form-select {
      border-radius: 10px;
      border: 1px solid #cdd7ce;
      min-height: 44px;
    }
    .form-control:focus,
    .form-select:focus {
      border-color: #2c9a46;
      box-shadow: 0 0 0 0.2rem rgba(44, 154, 70, 0.18);
    }
    .predict-btn {
      width: 100%;
      min-height: 46px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      letter-spacing: 0.2px;
      background: linear-gradient(135deg, #2e9f47, #247b37);
      color: #fff;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin-top: 8px;
    }
    .predict-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(36, 123, 55, 0.3);
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <h1 class="hero-title">Get informed advice on fertilizer based on soil</h1>
    <div class="glass-card">
      <div class="section-title">Enter Soil Nutrients and Target Crop</div>
      <form method="POST" name="myform" action="{{ url_for('fertilizer_prediction') }}">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="nit2">Nitrogen</label>
            <input class="form-control" type="number" id="nit2" name="nitrogen" min="1" max="100" placeholder="e.g. 50" required>
            <div id="res"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="pho2">Phosphorous</label>
            <input class="form-control" type="number" id="pho2" name="phosphorous" min="1" max="100" placeholder="e.g. 50" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="pot2">Pottasium</label>
            <input class="form-control" type="number" id="pot2" name="pottasium" min="1" max="100" placeholder="e.g. 50" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="crop">Crop you want to grow</label>
            <select class="form-select" name="cropname" id="crop" required>
              <option selected>Select crop</option>
              <option>rice</option>
              <option>maize</option>
              <option>chickpea</option>
              <option>kidneybeans</option>
              <option>pigeonpeas</option>
              <option>mothbeans</option>
              <option>mungbean</option>
              <option>blackgram</option>
              <option>lentil</option>
              <option>pomegranate</option>
              <option>banana</option>
              <option>mango</option>
              <option>grapes</option>
              <option>watermelon</option>
              <option>muskmelon</option>
              <option>apple</option>
              <option>orange</option>
              <option>papaya</option>
              <option>coconut</option>
              <option>cotton</option>
              <option>jute</option>
              <option>coffee</option>
            </select>
          </div>
          <div class="col-12">
            <button class="predict-btn" type="submit">Predict Fertilizer</button>
          </div>
        </div>
      </form>
    </div>
  </div>
        <script>
          function validatef1(){
            var num = document.getElementById('nit2').value;
            
            if(num>0 && num<100){
              return true;
            }else{
              window.alert("Enter the value of nitrogen between 1 - 100");
              return false
            }
          }

          function validatef2(){
            var num = document.getElementById('pho2').value;
            
            if(num>0 && num<100){
              return true;
            }else{
              window.alert("Enter the value of phospharaus between 1 - 100");
              return false
            }
          }
          function validatef3(){
            var num = document.getElementById('pot2').value;
            
            if(num>0 && num<100){
              return true;
            }else{
              window.alert("Enter the value of pottasium between 1 - 100");
              return false
            }
          }
        </script>
</body>
</html>
